[package]
name = "plironnx"
description = "Pliron for ONNX"
readme = "README.md"
repository = "https://github.com/pliron-org/plironnx"
categories = ["compilers"]
keywords = ["pliron", "onnx", "tensor", "compiler"]
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["plironnx-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
pliron = { git = "https://github.com/pliron-org/pliron.git" }
pliron-llvm = { git = "https://github.com/pliron-org/pliron.git" }
pliron-common-dialects = { git = "https://github.com/pliron-org/pliron-common-dialects.git" }
pliron-tensor = { git = "https://github.com/pliron-org/pliron-tensor.git" }

[dependencies]
pliron.workspace = true
pliron-llvm.workspace = true
pliron-common-dialects.workspace = true
pliron-tensor.workspace = true
onnx-ir = { git = "https://github.com/tracel-ai/burn-onnx.git", package = "onnx-ir", tag = "v0.22.0" }

thiserror = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0"

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/pliron-org/pliron.git", branch = "master", pattern = "lints/pliron_lints" },
]
